<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No "viewport-fit=cover": with it, newer Android Chrome draws the app underneath the
         system navigation bar, so the bottom of every screen (the shutter, the tab bar) hid
         behind it. Without it, the app sits neatly between the status and navigation bars. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#286344" />
    <meta name="description" content="Potpal: snap a leaf, meet your plant, and keep it happy." />
    <!-- Lets people "Add to Home Screen" and open Potpal full-screen like an app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preload" href="/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/roboto.woff2" as="font" type="font/woff2" crossorigin />
    <title>Potpal</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
