<!doctype html>
<!-- Shown by the service worker (sw.js) when Potpal can't reach the internet.
     Everything is inline, because there's no connection to fetch anything else. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#286344" />
    <title>Potpal · Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f7f6ee;
        color: #203c2d;
        font-family: ui-rounded, system-ui, sans-serif;
        text-align: center;
      }
      h1 { font-size: 24px; margin: 16px 0 8px; }
      p { margin: 0 0 24px; color: #738075; line-height: 1.5; }
      button {
        border: 0;
        border-radius: 999px;
        padding: 14px 28px;
        background: #286344;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#286344" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M14 9.5V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4m0 0c0 2 1 3 1 5a5 5 0 0 1-1 3m0-8a5 5 0 0 0-8-4 5 5 0 0 0 8 4ZM5 21h14" />
      </svg>
      <h1>You're offline</h1>
      <p>Potpal needs the internet to reach your plants.<br />Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
